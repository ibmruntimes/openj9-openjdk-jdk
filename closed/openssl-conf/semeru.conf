my %targets = (
	"semeru"            => { shlib_variant => "-semeru", template => 1 },
	# AIX: plain .so (aix-solib); extension and target are set on the leaf targets to avoid concatenation.
	"semeru-aix"        => {
		inherit_from        => [ "semeru" ],
		shared_ldflag       => add("-Wl,-blibpath:/usr/lib:/lib"),
		template            => 1
	},
	# Darwin: dylib with an @rpath install name; flags are carried here because the custom shared_target has no shared-info.pl entry.
	"semeru-darwin"     => {
		inherit_from        => [ "semeru" ],
		shared_ldflag       => add("-dynamiclib",
		                          "-current_version \$(SHLIB_VERSION_NUMBER)",
		                          "-compatibility_version \$(SHLIB_VERSION_NUMBER)",
		                          "-Wl,-rpath,\@loader_path/"),
		shared_sonameflag   => "-install_name \@rpath/",
		template            => 1
	},
	"semeru-linux"      => {
		inherit_from        => [ "semeru" ],
		shared_extension    => ".so",
		shared_ldflag       => add("-Wl,-rpath,'\$\$'ORIGIN"),
		template            => 1
	},
	# Plain strings on the leaf override the parents' shared_extension, which would otherwise be concatenated.
	"semeru-ap64"       => { inherit_from => [ "aix64-cc",    "semeru-aix" ], shared_target => "aix-solib", shared_extension => ".so" },
	"semeru-ap64-clang" => { inherit_from => [ "aix64-clang", "semeru-aix" ], shared_target => "aix-solib", shared_extension => ".so" },
	# A shared_target absent from shared-info.pl stops Configure merging darwin-shared flags over ours.
	"semeru-oa64"       => { inherit_from => [ "darwin64-x86_64-cc", "semeru-darwin" ], shared_target => "semeru-darwin-shared", shared_extension => ".dylib" },
	"semeru-or64"       => { inherit_from => [ "darwin64-arm64-cc",  "semeru-darwin" ], shared_target => "semeru-darwin-shared", shared_extension => ".dylib" },
	"semeru-xa64"       => { inherit_from => [ "linux-x86_64", "semeru-linux" ] },
	"semeru-xl64"       => { inherit_from => [ "linux-ppc64le", "semeru-linux" ] },
	"semeru-xr64"       => { inherit_from => [ "linux-aarch64", "semeru-linux" ] },
	"semeru-xv64"       => { inherit_from => [ "linux64-riscv64", "semeru-linux" ] },
	"semeru-xz64"       => { inherit_from => [ "linux64-s390x", "semeru-linux" ] },
	# The name must start with "VC-"; multilib => "" drops "-x64", giving libcrypto-3-semeru.dll.
	"VC-wa64"           => { inherit_from => [ "VC-WIN64A", "semeru" ], multilib => "" },
);
